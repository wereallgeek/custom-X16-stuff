; ============================================================
;  multicart.cfg  -  settings for makeMulticart.ps1
;  Lines starting with ; or # are comments.
;
;  COLOR KEYS (use the name or the number 0-15):
;     0 black        4 purple       8  orange      12 gray
;     1 white        5 green        9  brown       13 lightgreen
;     2 red          6 blue         10 lightred    14 lightblue
;     3 cyan         7 yellow       11 darkgray    15 lightgray
;  ("grey" / "darkgrey" / "lightgrey" are accepted too)
;  "transparent" = color 0 (same as black). It shows the background picture
;  through when [background] is enabled; see the notes in [background] below.
; ============================================================

[cartridge]
; output file name (written next to this .cfg)
output = ROM1.BIN
; auto = smallest chip that fits (16K, 32K ... 512K and up), or a fixed size such as 512K
size   = auto
; compress = yes: compress the DATA files of games (the 3rd column in [programs]) 
; with lzsa, to save space on the chip.
;   - Needs lzsa.exe (https://github.com/emmanuel-marty/lzsa): put it next to the
;     script or the .cfg, or give its full path in "lzsa" below.
;   - Typically 40-50% smaller.
;   - The game takes a few seconds longer to start but possibility to display a loading message.
;   - Plain .PRG files and the background picture are never compressed.
;   - This is the default for all games. Each game can override it with an optional
;     5th column in [programs] (yes or no), to compress only one program: leave
;     compress = no here and add "| yes" at the end of the program's line.
compress = no
lzsa     = lzsa.exe
; autoexec = no | yes | single
;   no     = always show the menu, with no delay at all.
;   yes    = after power-on, start the FIRST program of the list by itself after a short delay
;            (autoexec_delay below), unless F4 is pressed (or held while powering on): then the menu is shown.
;   single = single-game cartridge. The menu, the background picture and F4 are never used: the cartridge
;            contains ONLY the first program of the list (the others are ignored) and just does what that
;            game needs to run, then starts it right away. The [screen], [box], [menu] and [background]
;            sections are ignored. The "Loading" message is still shown if the game's data is compressed.
autoexec = no
; autoexec_delay = how long to wait for F4 before starting the first program,
;   in jiffies (1 jiffy = 1/60 second; 1 to 255). Only used when autoexec = yes.
;     15 = 0.25 s     30 = 0.5 s (default)     60 = 1 s     120 = 2 s
autoexec_delay = 30
; title shown in the tab of the top banner
title  = Cartridge Title

[screen]
; 80x60, 80x30, 40x60, 40x30 or default
mode       = 80x60
; upper (uppercase + graphics) or lower (lowercase)
charset    = upper
background = blue
text       = lightblue
; screen border color, or default
border     = blue

[box]
; position (column x, row y) and size of the panel.
; If omitted: centered with a margin.
x      = 12
y      = 8
width  = 56
height = 30
; panel background and text color
background = lightblue
text       = white
; rounded inner frame (color or none)
frame  = white
; top banner (color or none)
banner = red
title_color      = white
title_background = red

[menu]
; entries area. If omitted: computed from the panel.
x     = 16
y     = 13
width = 48
rows  = 14
text                = white
background          = lightblue
selected_text       = blue
selected_background = white
; text at the bottom (leave empty for the default)
footer       = UP/DOWN: SELECT   ENTER/START: GO   ESC: BASIC
footer_color = white
; yes = ESC returns to BASIC (with a Y/N confirmation)
allow_exit   = yes

[programs]
; Format:  Displayed name | FILE.PRG
; Files are looked up in the folder of this .cfg
game number 1 | GAME.PRG
second        | SECOND.PRG
Other         | OTHER.PRG

; Examples with a data file (remove the ; to enable):
;  Name | PRG | DATA | loader [| yes/no]    (loader = binx16, tanookix16 or diskemu;
;                                             optional last column: compress this game's data or not)
; SBMgame  | SMBX16.PRG  | SMBX16.BIN  | binx16
; SBM3game | SMB3X16.PRG | SMB3X16.BIN | tanookix16 | yes
; nesgame | FOLDER\NESGAME.PRG | FOLDER | diskemu

[background]
; Optional full-screen picture shown behind the menu.
;
; enabled = yes / no
enabled = no
; file = picture file name, looked up in the folder of this .cfg
file    = BACKGROUND.PNG
;
; PICTURE SPECS
;  - Needs  screen.mode = 80x30  (picture is 640x240 pixels)
;        or screen.mode = 40x30  (picture is 320x240 pixels).
;    The 60-row modes (80x60, 40x60) cannot show a picture.
;  - On screen the picture is stretched 2x vertically (80x30 mode) or 2x in
;    both directions (40x30 mode), so a normal 4:3 picture looks right:
;    give a 640x480 (80x30 mode) or 320x240 (40x30 mode) image.
;  - Any size and format Windows can read (PNG, BMP, GIF, JPG) is accepted;
;    it is resized to 640x240 / 320x240 automatically. A picture that already
;    has exactly the right size is used pixel for pixel.
;  - Maximum 15 colors (VERA 4-bit bitmap, color 0 is kept free). Colors are
;    rounded to 12 bits (16 levels per channel). Pictures with more colors are
;    reduced automatically, without dithering, so a picture you already drew
;    with 15 colors or fewer looks best. Photos will look posterized.
;  - Size cost in the cartridge: 76,800 bytes (80x30) or 38,400 bytes (40x30).
;  - The picture has its own palette: the text colors are not affected.
;
; HOW IT SHOWS THROUGH
;  - The picture is visible wherever a text cell has the "transparent" color
;    (color 0 = black). For a full-screen picture, set screen.background,
;    box.background and menu.background to transparent. (If screen.background
;    is left out, it defaults to transparent when the picture is enabled.)
;  - Text drawn in color 0 / black is invisible while the picture is on:
;    use another color for text, frames and the selected bar text.

[loading]
; Message shown in the middle of the screen (default blue screen) while a game
; with COMPRESSED data is being unpacked. Games without compression start
; right away and show nothing. One "." is added about every
; half second while compressed data is being unpacked, so you can see it is
; not stuck. Leave "text" empty to show nothing.
text = Loading
